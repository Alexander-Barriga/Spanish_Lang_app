services:
  - type: web
    name: spanish-lab-api
    runtime: node
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_VOICE_ID_ARGENTINA
        sync: false
      - key: ELEVENLABS_VOICE_ID_MEXICO
        sync: false
      - key: ELEVENLABS_VOICE_ID_COLOMBIA
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
